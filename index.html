<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG 转 PNG 工具</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f5f9;
    --panel: #ffffff;
    --panel-2: #eef1f6;
    --border: #dde3ec;
    --dash: #c3ccda;
    --text: #1c2430;
    --text-dim: #5f6b7c;
    --accent: #2f7bf5;
    --accent-2: #1c64d8;
    --green: #16a34a;
    --red: #dc2626;
    --on-accent: #ffffff;
    --input-bg: #fafbfd;
    --checker-a: #e7ecf3;
    --checker-b: #d9e0ea;
    --meta-bg: rgba(255, 255, 255, .85);
    --radius: 10px;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --dash: #3a4250;
    --text: #e6e8ee;
    --text-dim: #9aa3b2;
    --accent: #6db3ff;
    --accent-2: #4a8ef0;
    --green: #59d98c;
    --red: #ff6b6b;
    --on-accent: #0b1220;
    --input-bg: #11141a;
    --checker-a: #1a1e26;
    --checker-b: #161a21;
    --meta-bg: rgba(15, 17, 21, .75);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--panel);
  }
  header .logo {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #ffb86b, #ff6b6b);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    font-size: 15px; font-weight: 700; color: #1a1a1a;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header p { margin: 0; font-size: 12.5px; color: var(--text-dim); }
  #themeToggle {
    margin-left: auto;
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--panel);
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    transition: filter .15s;
    flex: none;
  }
  #themeToggle:hover { filter: brightness(.94); }
  #themeToggle .icon-sun { display: none; }
  [data-theme="dark"] #themeToggle .icon-sun { display: inline; }
  [data-theme="dark"] #themeToggle .icon-moon { display: none; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 20px 26px;
    padding: 18px 28px;
    min-height: 0;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; overflow: auto; }
  }
  .panel {
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .panel-head {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
  }
  .panel-head .badge {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
  }
  /* 输入区域 */
  #dropZone {
    margin: 16px 16px 12px;
    padding: 22px 16px;
    border: 2px dashed var(--dash);
    border-radius: var(--radius);
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #dropZone.drag { border-color: var(--accent); background: rgba(109,179,255,.07); }
  #dropZone .big { font-size: 22px; display: block; margin-bottom: 4px; }
  #svgInput {
    margin: 0 16px;
    flex: 1;
    min-height: 120px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 12px 14px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12.5px;
    line-height: 1.5;
    resize: none;
    outline: none;
    white-space: pre;
  }
  #svgInput:focus { border-color: var(--accent-2); }
  /* 选项栏 */
  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    padding: 12px 16px 4px;
    align-items: center;
  }
  .opt { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim); }
  .opt input[type="range"] { width: 120px; accent-color: var(--accent); }
  .opt input[type="number"], .opt input[type="text"] {
    width: 64px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 12.5px;
    outline: none;
  }
  .opt input:focus { border-color: var(--accent-2); }
  .opt label { cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .opt input[type="color"] {
    width: 30px; height: 24px; padding: 0; border: 1px solid var(--border);
    background: none; border-radius: 6px; cursor: pointer;
  }
  .opt select {
    background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 6px; font-size: 12.5px; outline: none;
  }
  /* 操作栏 */
  .actions {
    display: flex;
    gap: 10px;
    padding: 14px 16px 16px;
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .15s, opacity .15s;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: var(--on-accent); }
  .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn:hover:not(:disabled) { filter: brightness(1.12); }
  /* 预览区 */
  .preview-body {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 20px;
    min-height: 0;
    background:
      linear-gradient(45deg, var(--checker-a) 25%, transparent 25%, transparent 75%, var(--checker-a) 75%),
      linear-gradient(45deg, var(--checker-a) 25%, var(--checker-b) 25%, var(--checker-b) 75%, var(--checker-a) 75%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
    position: relative;
    overflow: hidden;
  }
  #previewWrap {
    position: relative;
    max-width: 100%;
    max-height: 100%;
  }
  #previewSvg { display: block; max-width: 100%; max-height: 100%; }
  #pngResult { max-width: 100%; max-height: 100%; position: absolute; inset: 0; }
  #emptyHint { color: var(--text-dim); font-size: 13px; text-align: center; line-height: 1.8; }
  .preview-meta {
    position: absolute;
    top: 10px; left: 10px;
    font-size: 11.5px;
    color: var(--text-dim);
    background: var(--meta-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 9px;
  }
  #status {
    margin: 0 16px 14px;
    font-size: 12.5px;
    border-radius: 8px;
    padding: 8px 12px;
    display: none;
    line-height: 1.5;
  }
  #status.ok { display: block; background: rgba(89,217,140,.12); color: var(--green); border: 1px solid rgba(89,217,140,.35); }
  #status.err { display: block; background: rgba(255,107,107,.12); color: var(--red); border: 1px solid rgba(255,107,107,.35); word-break: break-all; }
</style>
</head>
<body>
<header>
  <div class="logo">SVG</div>
  <div>
    <h1>SVG 转 PNG 工具</h1>
    <p>粘贴或以拖拽方式加载 SVG,按需缩放并导出为 PNG —— 全部在本地浏览器完成,不上传任何数据</p>
  </div>
  <button id="themeToggle" type="button" aria-label="切换日间/夜间模式" title="切换日间/夜间模式">
    <span class="icon-moon">🌙</span>
    <span class="icon-sun">☀️</span>
  </button>
</header>

<main>
  <section class="panel">
    <div class="panel-head">输入 <span class="badge">SVG 源代码或文件</span></div>
    <div id="dropZone">
      <span class="big">📁</span>
      拖入 `.svg` 文件,或点击选择文件
      <input id="fileInput" type="file" accept=".svg,image/svg+xml" hidden>
    </div>
    <textarea id="svgInput" spellcheck="false" placeholder="&lt;?xml version=&quot;1.0&quot;?&gt;&#10;&lt;svg width=&quot;100&quot; height=&quot;100&quot; viewBox=&quot;0 0 100 100&quot;&gt;&#10;  &lt;circle cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;40&quot; fill=&quot;#ff6b6b&quot;/&gt;&#10;&lt;/svg&gt;"></textarea>
    <div class="options">
      <div class="opt">
        <label><input type="checkbox" id="optResize"> 输出尺寸</label>
        <input type="number" id="optWidth" value="0" min="1" disabled>
        <span>×</span>
        <input type="number" id="optHeight" value="0" min="1" disabled>
      </div>
      <div class="opt">
        <span>缩放</span>
        <input type="range" id="optScale" min="0.2" max="8" step="0.1" value="1">
        <span id="scaleLabel">1×</span>
      </div>
      <div class="opt">
        <span>背景</span>
        <label>
          <input type="radio" name="bg" value="transparent" checked> 透明
        </label>
        <label>
          <input type="radio" name="bg" value="color"> <input type="color" id="optBgColor" value="#ffffff" disabled>
        </label>
      </div>
    </div>
    <div class="actions">
      <button id="btnConvert" class="btn btn-primary" disabled>转换为 PNG</button>
      <button id="btnCopy" class="btn btn-secondary" disabled>复制到剪贴板</button>
      <button id="btnDownload" class="btn btn-primary" disabled>下载 PNG</button>
      <button id="btnExample" class="btn btn-secondary">载入示例</button>
    </div>
    <div id="status"></div>
  </section>

  <section class="panel">
    <div class="panel-head">预览 <span id="sizeBadge" class="badge">—</span></div>
    <div class="preview-body">
      <div class="preview-meta" id="metaLabel">未加载</div>
      <div id="previewWrap">
        <span id="emptyHint">转换后,<br>PNG 结果会显示在这里</span>
        <img id="pngResult" alt="PNG 预览" hidden>
      </div>
      <svg id="previewSvg" hidden></svg>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const svgInput = $("svgInput");
  const dropZone = $("dropZone");
  const fileInput = $("fileInput");
  const previewSvg = $("previewSvg");
  const pngResult = $("pngResult");
  const emptyHint = $("emptyHint");
  const previewWrap = $("previewWrap");
  const sizeBadge = $("sizeBadge");
  const metaLabel = $("metaLabel");
  const statusBox = $("status");
  const btnConvert = $("btnConvert");
  const btnCopy = $("btnCopy");
  const btnDownload = $("btnDownload");
  const btnExample = $("btnExample");
  const optScale = $("optScale");
  const scaleLabel = $("scaleLabel");
  const optWidth = $("optWidth");
  const optHeight = $("optHeight");
  const optResize = $("optResize");
  const optBgColor = $("optBgColor");
  const themeToggle = $("themeToggle");

  /* ---------- 日间/夜间主题 ---------- */
  const THEME_KEY = "svg2png:theme";
  function applyTheme(theme) {
    if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    else document.documentElement.removeAttribute("data-theme");
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }
  function initTheme() {
    let saved = "light";
    try { saved = localStorage.getItem(THEME_KEY) || "light"; } catch (e) {}
    if (saved !== "dark" && saved !== "light") saved = "light";
    if (saved === "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) saved = "dark";
    applyTheme(saved);
  }
  themeToggle.addEventListener("click", () => {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
  initTheme();

  let svgText = "";
  let pngBlob = null;
  let pngUrl = null;
  let sourceSize = { w: 0, h: 0 };

  /* ---------- 载入 SVG ---------- */
  function loadSvg(text) {
    svgText = text.trim();
    svgInput.value = svgText;
    pngBlob = null;
    pngResult.hidden = true;
    emptyHint.hidden = true;
    previewSvg.hidden = false;

    // 注入包裹节点,避免直接 set 到 <svg> 上时浏览器对命名空间的处理问题
    const parser = new DOMParser();
    try {
      const doc = parser.parseFromString(svgText, "image/svg+xml");
      const err = doc.querySelector("parsererror");
      if (err) throw new Error("SVG 解析失败");
      const node = doc.documentElement;
      if (node.tagName.toLowerCase() !== "svg") throw new Error("根元素不是 <svg>");
      const clone = node.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");

      // 若无 width/height,则按 viewBox 推断,否则 Image 无法得到自然尺寸
      const vb = node.getAttribute("viewBox");
      if (!clone.getAttribute("width")) {
        clone.setAttribute("width", vb ? (vb.trim().split(/[\s,]+/)[2] || "100") : "100");
      }
      if (!clone.getAttribute("height")) {
        clone.setAttribute("height", vb ? (vb.trim().split(/[\s,]+/)[3] || "100") : "100");
      }
      previewSvg.replaceChildren(clone);

      sourceSize.w = parseFloat(clone.getAttribute("width")) || 0;
      sourceSize.h = parseFloat(clone.getAttribute("height")) || 0;
      refitOptionSize();
      btnConvert.disabled = false;
      updateMeta();
      setStatus("", "");
    } catch (e) {
      setStatus("err", "SVG 解析失败:" + e.message);
      btnConvert.disabled = true;
      btnDownload.disabled = true;
      btnCopy.disabled = true;
    }
  }

  function updateMeta() {
    if (!svgText) return;
    const sw = sourceSize.w, sh = sourceSize.h;
    if (sw && sh) {
      metaLabel.textContent = "SVG " + trimNum(sw) + " × " + trimNum(sh) + " px";
    } else {
      metaLabel.textContent = "SVG 尺寸未知";
    }
  }

  /* 参数改动后旧结果可能不再对应参数,清空 PNG 结果 */
  function pngReset() {
    if (!pngBlob) return;
    pngBlob = null;
    if (pngUrl) { URL.revokeObjectURL(pngUrl); pngUrl = null; }
    pngResult.removeAttribute("src");
    pngResult.hidden = true;
    emptyHint.hidden = false;
    btnDownload.disabled = true;
    btnCopy.disabled = true;
    sizeBadge.textContent = "—";
    setStatus("", "");
  }

  function refitOptionSize() {
    if (!optResize.checked) { optWidth.value = ""; optHeight.value = ""; return; }
    if (sourceSize.w && sourceSize.h) {
      optWidth.value = Math.round(sourceSize.w * parseFloat(optScale.value));
      optHeight.value = Math.round(sourceSize.h * parseFloat(optScale.value));
    }
  }

  function trimNum(v) {
    const r = Math.round(v * 100) / 100;
    return String(r);
  }

  function setStatus(kind, msg) {
    statusBox.className = kind;
    statusBox.textContent = msg;
  }

  /* ---------- 事件 ---------- */
  dropZone.addEventListener("click", () => fileInput.click());
  dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("drag"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag"));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("drag");
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    if (!/\.svg$/i.test(f.name) && f.type !== "image/svg+xml") {
      setStatus("err", "请选择 .svg 文件");
      return;
    }
    f.text().then(loadSvg).catch(() => setStatus("err", "文件读取失败"));
  });
  fileInput.addEventListener("change", () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    f.text().then(loadSvg).catch(() => setStatus("err", "文件读取失败"));
    fileInput.value = "";
  });
  svgInput.addEventListener("input", () => {
    const t = svgInput.value.trim();
    if (t) {
      loadSvg(t);
    } else {
      svgText = ""; pngBlob = null; pngResult.hidden = true; emptyHint.hidden = false;
      previewSvg.hidden = true; btnConvert.disabled = true; btnDownload.disabled = true;
      btnCopy.disabled = true; metaLabel.textContent = "未加载"; sizeBadge.textContent = "—";
    }
  });

  btnExample.addEventListener("click", () => {
    loadSvg([
      '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">',
      '  <defs>',
      '    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">',
      '      <stop offset="0" stop-color="#ffb86b"/>',
      '      <stop offset="1" stop-color="#ff6b6b"/>',
      '    </linearGradient>',
      '  </defs>',
      '  <rect width="320" height="240" rx="18" fill="url(#g)"/>',
      '  <circle cx="100" cy="100" r="42" fill="#ffffff" opacity=".85"/>',
      '  <path d="M60 100 v-30 l-10-4 l10-6 v-8 l-10-4 l10-6 v-14 L40 18 v-6 l18-6' + '" stroke="#ffffff" fill="none" stroke-width="6" stroke-linecap="round"/>',
      '  <text x="200" y="130" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="66" font-weight="600" fill="#ffffff">SVG</text>',
      '  <text x="200" y="162" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#ffffff" opacity=".8">to PNG</text>',
      '  <rect x="60" y="178" width="200" height="14" rx="7" fill="#ffffff" opacity=".25"/>',
      '  <rect x="60" y="178" width="128" height="14" rx="7" fill="#ffffff"/>',
      '  <circle cx="262" cy="60" r="16" fill="#59d98c"/>',
      '</svg>'
    ].join("\n"));
    svgInput.focus();
    svgInput.select();
  });

  optScale.addEventListener("input", updateScaleUI);
  function updateScaleUI() {
    scaleLabel.textContent = trimNum(parseFloat(optScale.value)) + "×";
    refitOptionSize();
  }

  optResize.addEventListener("change", () => {
    optWidth.disabled = !optResize.checked;
    optHeight.disabled = !optResize.checked;
    if (!optResize.checked) { optWidth.value = ""; optHeight.value = ""; }
    else refitOptionSize();
  });
  optWidth.addEventListener("input", () => { if (optResize.checked) pngReset(); });
  optHeight.addEventListener("input", () => { if (optResize.checked) pngReset(); });

  document.querySelectorAll('input[name="bg"]').forEach((r) =>
    r.addEventListener("change", () => { optBgColor.disabled = document.querySelector('input[name="bg"]:checked').value !== "color"; })
  );

  /* ---------- 转换 ---------- */
  async function convert() {
    if (!svgText) return;
    setStatus("ok", "正在渲染…");
    btnConvert.disabled = true;

    const img = new Image();
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText);
    try {
      await img.decode();
    } catch (e) {
      setStatus("err", "无法解码该 SVG(可能包含不受支持的内容)。" + (e.message || ""));
      btnConvert.disabled = true;
      btnDownload.disabled = true;
      btnCopy.disabled = true;
      return;
    }

    const iw = img.naturalWidth, ih = img.naturalHeight;
    if (!iw || !ih) {
      setStatus("err", "SVG 没有可用的自然尺寸,请为其补上 width/height 或 viewBox 属性。");
      btnConvert.disabled = false;
      return;
    }

    let outW, outH;
    const scale = parseFloat(optScale.value) || 1;
    if (optResize.checked && (optWidth.value || optHeight.value)) {
      if (optWidth.value && optHeight.value) {
        outW = Math.max(1, Math.round(parseFloat(optWidth.value)));
        outH = Math.max(1, Math.round(parseFloat(optHeight.value)));
      } else if (optWidth.value) {
        outW = Math.max(1, Math.round(parseFloat(optWidth.value)));
        outH = Math.max(1, Math.round(outW * ih / iw));
      } else {
        outH = Math.max(1, Math.round(parseFloat(optHeight.value)));
        outW = Math.max(1, Math.round(outH * iw / ih));
      }
    } else {
      outW = Math.max(1, Math.round(iw * scale));
      outH = Math.max(1, Math.round(ih * scale));
    }

    const canvas = document.createElement("canvas");
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext("2d");
    if (ctx === null) { setStatus("err", "当前环境不支持 Canvas 2D。"); btnConvert.disabled = false; return; }

    ctx.clearRect(0, 0, outW, outH);
    const bg = document.querySelector('input[name="bg"]:checked').value;
    if (bg === "color") {
      ctx.fillStyle = optBgColor.value;
      ctx.fillRect(0, 0, outW, outH);
    }

    try {
      ctx.drawImage(img, 0, 0, outW, outH);
      pngBlob = await new Promise((resolve, reject) =>
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("导出失败"))), "image/png")
      );
    } catch (e) {
      setStatus("err", "导出被拒绝:该 SVG 可能引用了跨域的外部图片,画布被浏览器判定为不可导出(安全限制)。");
      btnConvert.disabled = false;
      return;
    }

    if (pngUrl) URL.revokeObjectURL(pngUrl);
    pngUrl = URL.createObjectURL(pngBlob);
    pngResult.src = pngUrl;
    pngResult.hidden = false;
    emptyHint.hidden = true;
    btnDownload.disabled = false;
    btnCopy.disabled = false;
    btnConvert.disabled = false;

    sizeBadge.textContent = iw + " × " + ih + " → " + outW + " × " + outH;
    metaLabel.textContent = "SVG " + iw + " × " + ih + " px · 输出 " + outW + " × " + outH + " px · " +
      (pngBlob.size / 1024).toFixed(1) + " KB";
    setStatus("ok", "转换完成:SVG " + iw + " × " + ih + " → PNG " + outW + " × " + outH + "(约 " +
      (pngBlob.size / 1024).toFixed(1) + " KB)");
  }

  btnConvert.addEventListener("click", convert);

  btnDownload.addEventListener("click", () => {
    if (!pngUrl) return;
    const a = document.createElement("a");
    a.href = pngUrl;
    a.download = "output_" + outW + "x" + outH + ".png";
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
  let outW = 0, outH = 0;

  btnCopy.addEventListener("click", async () => {
    if (!pngBlob) return;
    try {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": pngBlob })]);
      setStatus("ok", "已复制 PNG 到剪贴板。");
    } catch (e) {
      setStatus("err", "复制失败,请改用「下载 PNG」。" + (e.message || ""));
    }
  });

  /* 模拟加载示例 */
  loadSvg([
    '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">',
    '  <defs>',
    '    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">',
    '      <stop offset="0" stop-color="#ffb86b"/>',
    '      <stop offset="1" stop-color="#ff6b6b"/>',
    '    </linearGradient>',
    '  </defs>',
    '  <rect width="320" height="240" rx="18" fill="url(#g)"/>',
    '  <circle cx="100" cy="100" r="42" fill="#ffffff" opacity=".85"/>',
    '  <rect x="60" y="178" width="200" height="14" rx="7" fill="#ffffff" opacity=".25"/>',
    '  <rect x="60" y="178" width="128" height="14" rx="7" fill="#ffffff"/>',
    '  <circle cx="262" cy="60" r="16" fill="#59d98c"/>',
    '  <text x="200" y="130" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="66" font-weight="600" fill="#ffffff">SVG</text>',
    '  <text x="200" y="162" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#ffffff" opacity=".8">to PNG</text>',
    '</svg>'
  ].join("\n"));
})();
</script>
</body>
</html>
